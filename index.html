<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="product-preview.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center;
      margin-top: 11px;
    }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="ff-montserrat">
  <main>
    



<picture>

   <source srcset="./images/image-product-mobile.jpg" media="(min-width: 20em)" width="800" height="400">
     <source srcset="./images/image-product-desktop.jpg" media="(min-width: 90em)" width="1200" height="500">
  <img src="./images/image-product-mobile.jpg" alt="A description of the image." width="400" height="400" loading="eager" decoding="sync">
</picture>


     
              
   
            <section>
                <p class="perfume neutral-text-grey uppercase  spacing-300">Perfume</p>
                    <h1 class="landing-text semi-weight spacing-100 ff-fraunces">Gabrielle Essence Eau De Parfum</h1>
                        <p class="text-main ff-montserrat  neutral-text-grey">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
                            Perfumer-Creator for the House of CHANEL.</p>
                      <div class="container">
                          <span class="price1 ff-montserrat green-text-500 semi-weight">$149.99</span>
                               <span class=" price2 ff-fraunces neutral-text-grey"><s>$169.99</s></span>
            
                       </div>
                              <div class="footer green-500 neutral-text-white">
                                  <img alt="woow" src="./images/icon-cart.svg">
                                  <span class="cart ff-montserrat semi-weight">Add to Cart</span>
                                </div>
              </section>
  </main>



  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Sthofo</a>.
  </div>
</body>
</html>
